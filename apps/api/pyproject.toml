[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netsimflow-api"
version = "0.1.0"
description = "NetSim-Flow Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.3",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "weasyprint==52.5"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.3.7"
]

[tool.ruff]
line-length = 100
target-version = "py312"
