
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netsimflow
      POSTGRES_PASSWORD: password
      POSTGRES_DB: netsimflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netsimflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gns3:
    image: gns3/gns3-server:latest
    profiles: [gns3]
    ports:
      - "3080:3080"
    volumes:
      - gns3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3080/v2/version')\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  gns3_data:
